name: Build iOS IPA Test

on:
  workflow_dispatch:
    inputs:
      game:
        description: Game profile (title ID, see dm/games)
        default: '0400C3F00006E000'   # Mario Kart World

env:
  GAME: ${{ github.event.inputs.game || '0400C3F00006E000' }}
  DM_GAME: ${{ github.event.inputs.game || '0400C3F00006E000' }}
  DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: command -v xcodegen || brew install xcodegen

      - name: Build iOS
        run: |
          mkdir -p logs
          python3 dm/ios/tools/build_smoke.py --output "$RUNNER_TEMP/ios-smoke" 2>&1 | tee logs/ios-build.log

      - name: Package unsigned IPA
        run: |
          APP=$(find "$RUNNER_TEMP/ios-smoke" -type d -name "*.app" -path "*Build/Products*" -print -quit)
          if [ -z "$APP" ]; then
            echo "No se encontró ningún .app en $RUNNER_TEMP/ios-smoke"
            find "$RUNNER_TEMP/ios-smoke" -maxdepth 4 -type d | head -50
            exit 1
          fi
          echo "App: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr PlumberRacer2-Test.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PlumberRacer2-Test
          path: PlumberRacer2-Test.ipa

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-ios-build
          path: logs
          retention-days: 7
